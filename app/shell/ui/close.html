<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="win.close"></title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="dialog">
  <h1 data-i18n="close.heading"></h1>
  <button class="option" data-choice="gui"><span class="title" data-i18n="close.gui"></span><span class="note" data-i18n="close.gui.note"></span></button>
  <button class="option" data-choice="dsh"><span class="title" data-i18n="close.dsh"></span><span class="note" data-i18n="close.dsh.note"></span></button>
  <button class="option danger" data-choice="all"><span class="title" data-i18n="close.all"></span><span class="note" data-i18n="close.all.note"></span></button>
  <button class="option cancel" data-choice="cancel"><span class="title" data-i18n="close.cancel"></span></button>
  <div id="busy" class="busy hidden"><span class="dot"></span><span data-i18n="close.busy"></span></div>
  <div id="error" class="error hidden"></div>
</main>
<script src="i18n.js"></script>
<script src="close.js"></script>
</body>
</html>
